name: Firmware CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native tests and firmware build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run native regression suite
        run: pio test -e native

      - name: Smoke-test desktop simulator
        run: python tools/run_simulator.py --check

      - name: Build XIAO ESP32-S3 firmware
        run: pio run -e seeed_xiao_esp32s3

      - name: Stage firmware artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item .pio/build/seeed_xiao_esp32s3/firmware.bin artifacts/firmware.bin
          Copy-Item .pio/build/seeed_xiao_esp32s3/firmware.factory.bin artifacts/firmware.factory.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheelie-controller-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
