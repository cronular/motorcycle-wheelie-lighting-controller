name: Firmware CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native tests and firmware build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio cryptography

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run native regression suite
        run: pio test -e native

      - name: Test firmware packaging and model shaping
        run: python -m unittest discover -s test -p "test_*.py"

      - name: Smoke-test desktop simulator
        run: |
          python tools/check_embedded_web.py
          python tools/run_simulator.py --check
          python tools/build_simulator_site.py --output dist/simulator --check

      - name: Build XIAO ESP32-S3 firmware
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $env:BUILD_DATE = (git show -s --format=%cI HEAD)
          $targetBranch = '${{ github.base_ref }}'
          if ([string]::IsNullOrWhiteSpace($targetBranch)) { $targetBranch = '${{ github.ref_name }}' }
          $env:RELEASE_CHANNEL = if ($targetBranch -eq 'main') { 'stable' } else { 'testing' }
          pio run -e seeed_xiao_esp32s3

      - name: Stage firmware artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item .pio/build/seeed_xiao_esp32s3/firmware.bin artifacts/firmware.bin
          $factory = '.pio/build/seeed_xiao_esp32s3/firmware.factory.bin'
          if (Test-Path -LiteralPath $factory) {
            Copy-Item -LiteralPath $factory artifacts/firmware.factory.bin
          }

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheelie-controller-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
