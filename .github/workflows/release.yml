name: Publish firmware release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Test and build
        run: |
          pio test -e native
          python tools/run_simulator.py --check
          pio run -e seeed_xiao_esp32s3
      - name: Package binaries and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item .pio/build/seeed_xiao_esp32s3/firmware.bin release/wheelie-controller-${{ github.ref_name }}.bin
          $factory = '.pio/build/seeed_xiao_esp32s3/firmware.factory.bin'
          if (Test-Path -LiteralPath $factory) {
            Copy-Item -LiteralPath $factory release/wheelie-controller-${{ github.ref_name }}-factory.bin
          }
          Get-ChildItem release/*.bin | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
